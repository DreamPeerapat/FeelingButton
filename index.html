<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Feeling Board · 病人感受板</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --ink: #1f2a44;
      --muted: #6b7897;
      --accent: #3b7dd8;
      --accent-soft: #e7f0fd;
      --shadow: 0 6px 18px rgba(31, 42, 68, 0.10);
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, "PingFang SC",
        "Microsoft YaHei", "Noto Sans Thai", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      max-width: 900px;
      margin: 0 auto 8px;
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin: 0 0 6px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .hint {
      max-width: 620px;
      margin: 14px auto 26px;
      background: var(--accent-soft);
      color: #24507f;
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      font-size: 0.92rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .feeling-btn {
      position: relative;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 14px 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.12s ease, border-color 0.12s ease,
        box-shadow 0.12s ease;
      font-family: inherit;
      color: inherit;
      text-align: center;
    }

    .feeling-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(59, 125, 216, 0.22);
    }

    .feeling-btn:active { transform: translateY(0); }

    .feeling-btn.speaking {
      border-color: var(--accent);
      background: var(--accent-soft);
      animation: pulse 0.6s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .emoji {
      font-size: 3.4rem;
      line-height: 1;
    }

    .label-en {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .label-zh {
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 600;
    }

    .label-th {
      font-size: 0.92rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* Small badge in the corner showing whether a real recording is in use. */
    .src-badge {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 2px 6px;
      border-radius: 999px;
      opacity: 0.85;
    }
    .src-badge.rec { background: #e4f7ea; color: #1f8a4c; }
    .src-badge.tts { background: #fdf3e3; color: #a8720f; }

    footer {
      text-align: center;
      margin-top: 34px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .banner {
      max-width: 620px;
      margin: 14px auto 0;
      border-radius: 14px;
      padding: 10px 16px;
      text-align: center;
      font-size: 0.9rem;
    }
    .banner.info { background: var(--accent-soft); color: #24507f; }
    .banner.warn { background: #fdf3e3; color: #8a5a0f; }
  </style>
</head>
<body>
  <header>
    <h1>🩺 Patient Feeling Board</h1>
    <p>病人感受沟通板 · English / 中文 · Speaks Thai when tapped</p>
  </header>

  <div class="hint">
    👆 Tap a card to hear the feeling spoken in Thai (ภาษาไทย).<br />
    点击卡片，用泰语朗读该感受。
  </div>

  <div class="banner warn" id="banner" style="display:none"></div>

  <main class="grid" id="grid"></main>

  <footer>
    Made for patient–caregiver communication · 医患沟通辅助工具<br />
    <span style="font-size:0.78rem;">
      🟢 REC = real recording · 🟡 TTS = browser fallback voice
    </span>
  </footer>

  <script>
    // Each feeling has a stable "key" used for its audio file: audio/<key>.mp3
    // Labels: emoji picture + English + Chinese. "th" is the spoken Thai word,
    // used both for the on-screen text and as the browser fallback voice.
    const feelings = [
      { key: "hungry",   emoji: "🍚", en: "Hungry",   zh: "饿了",   th: "หิว" },
      { key: "thirsty",  emoji: "💧", en: "Thirsty",  zh: "口渴",   th: "หิวน้ำ" },
      { key: "pain",     emoji: "🤕", en: "Pain",     zh: "疼痛",   th: "เจ็บ" },
      { key: "sleepy",   emoji: "😴", en: "Sleepy",   zh: "困了",   th: "ง่วงนอน" },
      { key: "tired",    emoji: "😫", en: "Tired",    zh: "累了",   th: "เหนื่อย" },
      { key: "toilet",   emoji: "🚽", en: "Toilet",   zh: "上厕所", th: "เข้าห้องน้ำ" },
      { key: "cold",     emoji: "🥶", en: "Cold",     zh: "冷",     th: "หนาว" },
      { key: "hot",      emoji: "🥵", en: "Hot",      zh: "热",     th: "ร้อน" },
      { key: "nausea",   emoji: "🤢", en: "Nausea",   zh: "恶心",   th: "คลื่นไส้" },
      { key: "dizzy",    emoji: "😵‍💫", en: "Dizzy",  zh: "头晕",   th: "เวียนหัว" },
      { key: "breath",   emoji: "😮‍💨", en: "Short of Breath", zh: "呼吸困难", th: "หายใจไม่ออก" },
      { key: "itchy",    emoji: "🤧", en: "Itchy",    zh: "痒",     th: "คัน" },
      { key: "scared",   emoji: "😟", en: "Scared",   zh: "害怕",   th: "กลัว" },
      { key: "sad",      emoji: "😢", en: "Sad",      zh: "难过",   th: "เศร้า" },
      { key: "happy",    emoji: "🙂", en: "Happy",    zh: "开心",   th: "มีความสุข" },
      { key: "medicine", emoji: "💊", en: "Medicine", zh: "要吃药", th: "อยากกินยา" },
      { key: "help",     emoji: "🩹", en: "Help",     zh: "需要帮助", th: "ช่วยด้วย" },
      { key: "nurse",    emoji: "👨‍⚕️", en: "Call Nurse", zh: "叫护士", th: "เรียกพยาบาล" }
    ];

    const AUDIO_DIR = "audio/";
    const grid = document.getElementById("grid");
    const banner = document.getElementById("banner");
    const supportsSpeech = "speechSynthesis" in window;

    let thaiVoice = null;
    let currentAudio = null; // the <audio> currently playing, if any

    // ---- Browser fallback voice (used only when a recording is missing) ----
    function pickThaiVoice() {
      if (!supportsSpeech) return;
      const voices = window.speechSynthesis.getVoices();
      thaiVoice =
        voices.find(v => v.lang && v.lang.toLowerCase().startsWith("th")) || null;
    }
    if (supportsSpeech) {
      pickThaiVoice();
      window.speechSynthesis.onvoiceschanged = pickThaiVoice;
    }

    // Speak with the browser's built-in Thai voice. Returns false if the
    // browser has no speech support at all (so the caller can try something else).
    function speakWithBrowser(text, btn) {
      if (!supportsSpeech) return false;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "th-TH";
      if (thaiVoice) utter.voice = thaiVoice;
      utter.rate = 0.9;
      setSpeaking(btn, true);
      utter.onend = () => setSpeaking(btn, false);
      utter.onerror = () => setSpeaking(btn, false);
      window.speechSynthesis.speak(utter);
      return true;
    }

    // Online Thai TTS. Played through an <audio> element, which can load
    // cross-origin without CORS — so it works even in browsers that have no
    // Speech Synthesis API and even when no local recording exists.
    function onlineTtsUrl(text) {
      return "https://translate.google.com/translate_tts" +
        "?ie=UTF-8&tl=th&client=tw-ob&q=" + encodeURIComponent(text);
    }

    // ---- Playback: prefer the real recording, fall back to browser voice ----
    function stopEverything() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      if (supportsSpeech) window.speechSynthesis.cancel();
      document.querySelectorAll(".feeling-btn.speaking")
        .forEach(b => b.classList.remove("speaking"));
    }

    // Try to play an audio URL. Runs onFail() if it can't start.
    function tryAudioSrc(src, btn, isRecording, onFail) {
      let handled = false;
      const audio = new Audio(src);
      audio.addEventListener("playing", () => {
        setSpeaking(btn, true);
        setBadge(btn, isRecording);
      });
      audio.addEventListener("ended", () => {
        setSpeaking(btn, false);
        if (currentAudio === audio) currentAudio = null;
      });
      const fail = () => {
        if (handled) return;
        handled = true;
        if (currentAudio === audio) currentAudio = null;
        onFail();
      };
      audio.addEventListener("error", fail);
      currentAudio = audio;
      const p = audio.play();
      if (p && typeof p.catch === "function") p.catch(fail);
    }

    // Sound chain: local recording -> online Thai TTS -> browser voice -> banner.
    function play(f, btn) {
      stopEverything();
      tryAudioSrc(AUDIO_DIR + f.key + ".mp3", btn, /*isRecording*/ true, () => {
        // No local file: try online Thai TTS (works without the Speech API).
        tryAudioSrc(onlineTtsUrl(f.th), btn, /*isRecording*/ false, () => {
          // Online failed (offline/blocked): try the browser's Thai voice.
          if (!speakWithBrowser(f.th, btn)) {
            showBanner("Couldn't play sound. Connect to the internet, or add a " +
              "recording at audio/" + f.key + ".mp3 to play it offline.");
          }
        });
      });
    }

    // ---- UI helpers ----
    function setSpeaking(btn, on) {
      btn.classList.toggle("speaking", on);
    }

    function setBadge(btn, hasRecording) {
      const badge = btn.querySelector(".src-badge");
      if (!badge) return;
      if (hasRecording) {
        badge.textContent = "🟢 REC";
        badge.className = "src-badge rec";
      } else {
        badge.textContent = "🟡 TTS";
        badge.className = "src-badge tts";
      }
      badge.style.display = "inline-block";
    }

    function showBanner(msg) {
      banner.textContent = "⚠️ " + msg;
      banner.style.display = "block";
    }

    // ---- Build the board ----
    feelings.forEach(f => {
      const btn = document.createElement("button");
      btn.className = "feeling-btn";
      btn.setAttribute("type", "button");
      btn.setAttribute("aria-label", f.en + " / " + f.zh + " / " + f.th);
      btn.innerHTML = `
        <span class="src-badge" style="display:none"></span>
        <span class="emoji" aria-hidden="true">${f.emoji}</span>
        <span class="label-en">${f.en}</span>
        <span class="label-zh">${f.zh}</span>
        <span class="label-th">🔊 ${f.th}</span>
      `;
      btn.addEventListener("click", () => play(f, btn));
      grid.appendChild(btn);
    });

    // Recordings are loaded on demand at first tap. With no audio/ files at
    // all, taps still make sound via online Thai TTS (or the browser voice).
  </script>
</body>
</html>
